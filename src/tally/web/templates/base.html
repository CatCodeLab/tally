<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('app_name') }}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <b class="brand">{{ t('app_name') }}</b>
  <nav>
    <a href="/">{{ t('nav_overview') }}</a>
    <a href="/entries">{{ t('nav_entries') }}</a>
    <a href="/pairing">{{ t('nav_pairing') }}</a>
  </nav>
</header>
<main>
{% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
